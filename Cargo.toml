# Still-image decode, encode, and bilinear resample. PNG IDAT uses anvil-compress.
# Caps: 8192 px per side and 16,777,216 pixels.
# Callers: anvil-layout (intrinsic img size) and anvil-raster (pixel sample),
# both in anvil-engine, and anvil-browser (decode_auto on page images). CPU only.

[package]
name = "anvil-image"
version = "0.7.1"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato <324143321+buntatoes@users.noreply.github.com>"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial"
description = "PNG, JPEG, GIF, WebP, ICO, BMP, and PPM. PNG chunk checksums are checked."
repository = "https://github.com/buntatoes/anvil-image"
homepage = "https://github.com/buntatoes/anvil-image"
readme = "README.md"
keywords = ["png", "jpeg", "webp", "image"]
categories = ["multimedia::images", "rendering::data-formats"]
publish = false

[dependencies]
anvil-compress = { path = "../anvil-compress" }
