[package]
name = "flux-image"
version = "0.4.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "PNG, JPEG, GIF89a, WebP, ICO, BMP, and Netpbm image decoder, encoder, bilinear resampler, and allocation-bomb guard (Proof of Concept)."
repository = "https://github.com/buntatoes/flux-image"
homepage = "https://github.com/buntatoes/flux-image"
readme = "README.md"
keywords = ["png", "jpeg", "webp", "image", "proof-of-concept"]
categories = ["multimedia::images", "rendering::data-formats"]

[dependencies]
flux-compress = { path = "../flux-compress" }
